; iSpindleStation — build config for ESP8266 relay (Nautilis iRelay NXT / d1_mini class).
; Display: GC9A01 240x240 round TFT on hardware HSPI (SCK=14, MOSI=13, CS=0, DC=4, RST=5, BL=15).

[platformio]
default_envs = relay

[env:relay]
platform = espressif8266@4.2.1
framework = arduino
board = d1_mini
monitor_speed = 115200
lib_deps =
	ArduinoJson@<7 ; v7 removed DynamicJsonDocument
	WiFiManager@^0.16.0 ; MIT; the vendored KT fork wants iSpindel's Globals.h
	bodmer/TFT_eSPI@^2.5.43
build_flags =
	-DUSER_SETUP_LOADED=1
	-DGC9A01_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=240
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=0
	-DTFT_DC=4
	-DTFT_RST=5
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
