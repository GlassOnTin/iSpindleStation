; iSpindleStation — v0 build config.
; Board assumption: d1_mini-class ESP8266 until the relay's bench flash-id
; pins the real board and flash layout (see docs/protocol.md).

[platformio]
default_envs = relay

[env:relay]
platform = espressif8266@4.2.1
framework = arduino
board = d1_mini
monitor_speed = 115200
lib_deps =
	ArduinoJson@<7 ; v7 removed DynamicJsonDocument
	WiFiManager@^0.16.0 ; MIT; the vendored KT fork wants iSpindel's Globals.h
